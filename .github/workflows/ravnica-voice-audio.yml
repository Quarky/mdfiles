name: Build Ravnica Voice Reader Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ravnica-voice-audio.yml'

permissions:
  contents: read

jobs:
  build-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install TTS and audio tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          if ! command -v espeak >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y espeak
          fi

      - name: Prepare spoken script and chunks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path("Ravnica-v2/Voice-Reader/Ravnica-v2-Complete-Voice-Reader.md")
          text = src.read_text(encoding="utf-8")
          text = re.sub(r"\A---\s*\n.*?\n---\s*\n", "", text, flags=re.S)
          text = re.sub(r"\[\[([^\]|]+)\|([^\]]+)\]\]", r"\2", text)
          text = re.sub(r"\[\[([^\]]+)\]\]", lambda m: m.group(1).split("/")[-1].replace("-", " "), text)
          text = re.sub(r"\[([^\]]+)\]\((?:https?://[^)]+|[^)]+)\)", r"\1", text)
          text = re.sub(r"(?m)^https?://\S+\s*$", "Source link.", text)
          text = re.sub(r"(?m)^#{1,6}\s+", "", text)
          text = re.sub(r"(?m)^>\s?", "", text)
          text = re.sub(r"(?m)^\s*[-*+]\s+", "", text)
          text = re.sub(r"(?m)^\s*\d+[.)]\s+", "", text)
          text = re.sub(r"(?m)^\s*---+\s*$", "", text)
          text = re.sub(r"\x60{1,3}", "", text)
          text = text.replace("**", "").replace("__", "").replace("*", "")
          text = re.sub(r"(?m)^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$", "", text)
          text = re.sub(r"(?m)^\s*\|(.+)\|\s*$", lambda m: ". ".join(c.strip() for c in m.group(1).split("|") if c.strip()), text)
          text = text.replace("\r\n", "\n")
          text = re.sub(r"[ \t]+", " ", text)
          text = re.sub(r"\n{3,}", "\n\n", text).strip() + "\n"

          out = Path("voice-output")
          chunks = out / "chunks"
          chunks.mkdir(parents=True, exist_ok=True)
          (out / "Ravnica-v2-Complete-Voice-Reader-Spoken-Script.txt").write_text(text, encoding="utf-8")

          paras = [p.strip() for p in text.split("\n\n") if p.strip()]
          pieces = []
          MAX = 2600
          for p in paras:
              if len(p) <= MAX:
                  pieces.append(p)
                  continue
              sentences = re.split(r"(?<=[.!?])\s+", p)
              cur = ""
              for s in sentences:
                  if not s:
                      continue
                  if len(s) > MAX:
                      if cur:
                          pieces.append(cur.strip()); cur = ""
                      for i in range(0, len(s), MAX):
                          pieces.append(s[i:i+MAX].strip())
                  elif len(cur) + len(s) + 1 > MAX:
                      pieces.append(cur.strip()); cur = s
                  else:
                      cur = (cur + " " + s).strip()
              if cur:
                  pieces.append(cur.strip())

          for i,p in enumerate(pieces,1):
              (chunks / f"{i:04d}.txt").write_text(p + "\n", encoding="utf-8")
          print(f"Prepared {len(pieces)} chunks from {len(text):,} spoken characters.")
          PY

      - name: Synthesize natural voice with offline fallback
        shell: bash
        run: |
          set -u
          mkdir -p voice-output/segments voice-output/wav
          success=0
          fallback=0
          for f in voice-output/chunks/*.txt; do
            base="$(basename "$f" .txt)"
            out="voice-output/segments/\${base}.mp3"
            ok=0
            for attempt in 1 2 3; do
              if edge-tts --voice en-US-AriaNeural --rate=-6% --file "$f" --write-media "$out"; then
                if [ -s "$out" ]; then ok=1; break; fi
              fi
              sleep $((attempt * 2))
            done
            if [ "$ok" -eq 1 ]; then
              success=$((success+1))
            else
              fallback=$((fallback+1))
              wav="voice-output/wav/\${base}.wav"
              espeak -v en-us -s 165 -f "$f" -w "$wav"
              ffmpeg -hide_banner -loglevel error -y -i "$wav" -ar 24000 -ac 1 -b:a 32k "$out"
              rm -f "$wav"
            fi
          done
          echo "Natural-voice chunks: $success"
          echo "Fallback chunks: $fallback"

      - name: Combine and compress audiobook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          segs = sorted(Path("voice-output/segments").glob("*.mp3"))
          with open("voice-output/concat.txt","w",encoding="utf-8") as f:
              for p in segs:
                  f.write("file '" + p.resolve().as_posix().replace("'", "'\\''") + "'\n")
          print("Segments:", len(segs))
          PY
          ffmpeg -hide_banner -loglevel warning -y \
            -f concat -safe 0 -i voice-output/concat.txt \
            -ac 1 -ar 24000 -b:a 32k \
            -metadata title="Ravnica V2 — Complete Living-World Voice Reader" \
            -metadata artist="MTGFoundry" \
            voice-output/Ravnica-v2-Complete-Living-World-Voice-Reader.mp3
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            voice-output/Ravnica-v2-Complete-Living-World-Voice-Reader.mp3 \
            | tee voice-output/audio-info.txt

      - name: Upload audiobook
        uses: actions/upload-artifact@v4
        with:
          name: Ravnica-v2-Complete-Voice-Reader-Audio
          path: |
            voice-output/Ravnica-v2-Complete-Living-World-Voice-Reader.mp3
            voice-output/Ravnica-v2-Complete-Voice-Reader-Spoken-Script.txt
            voice-output/audio-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
