name: Build Ravnica Voice Reader Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ravnica-voice-audio.yml'

permissions:
  contents: read

jobs:
  build-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audio tools
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v espeak >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg espeak
          fi

      - name: Prepare spoken script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path("Ravnica-v2/Voice-Reader/Ravnica-v2-Complete-Voice-Reader.md")
          text = src.read_text(encoding="utf-8")

          # Remove the single-file YAML frontmatter, but retain the full substantive reading content.
          text = re.sub(r"\A---\s*\n.*?\n---\s*\n", "", text, flags=re.S)

          # Make Markdown natural to hear while retaining its words.
          text = re.sub(r"\[\[([^\]|]+)\|([^\]]+)\]\]", r"\2", text)
          text = re.sub(r"\[\[([^\]]+)\]\]", lambda m: m.group(1).split("/")[-1].replace("-", " "), text)
          text = re.sub(r"\[([^\]]+)\]\((?:https?://[^)]+|[^)]+)\)", r"\1", text)
          text = re.sub(r"(?m)^https?://\S+\s*$", "Source link.", text)
          text = re.sub(r"(?m)^#{1,6}\s+", "", text)
          text = re.sub(r"(?m)^>\s?", "", text)
          text = re.sub(r"(?m)^\s*[-*+]\s+", "", text)
          text = re.sub(r"(?m)^\s*\d+[.)]\s+", "", text)
          text = re.sub(r"(?m)^\s*---+\s*$", "", text)
          text = re.sub(r"\x60{1,3}", "", text)
          text = text.replace("**", "").replace("__", "").replace("*", "")
          text = re.sub(r"(?m)^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$", "", text)
          text = re.sub(r"(?m)^\s*\|(.+)\|\s*$", lambda m: ". ".join(c.strip() for c in m.group(1).split("|") if c.strip()), text)
          text = text.replace("\r\n", "\n")
          text = re.sub(r"[ \t]+", " ", text)
          text = re.sub(r"\n{3,}", "\n\n", text).strip() + "\n"

          out = Path("voice-output")
          out.mkdir(exist_ok=True)
          spoken = out / "Ravnica-v2-Complete-Voice-Reader-Spoken-Script.txt"
          spoken.write_text(text, encoding="utf-8")

          words = len(re.findall(r"\b[\w’'-]+\b", text))
          chars = len(text)
          (out / "script-info.txt").write_text(f"words={words}\ncharacters={chars}\n", encoding="utf-8")
          print(f"Prepared {words:,} words / {chars:,} spoken characters.")
          PY

      - name: Generate complete audiobook
        shell: bash
        run: |
          set -o pipefail
          espeak -v en-us+f3 -s 165 --stdout -f voice-output/Ravnica-v2-Complete-Voice-Reader-Spoken-Script.txt \
            | ffmpeg -hide_banner -loglevel warning -y -i pipe:0 \
                -ac 1 -ar 24000 -b:a 32k \
                -metadata title="Ravnica V2 — Complete Living-World Voice Reader" \
                -metadata artist="MTGFoundry" \
                voice-output/Ravnica-v2-Complete-Living-World-Voice-Reader.mp3

          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            voice-output/Ravnica-v2-Complete-Living-World-Voice-Reader.mp3 \
            | tee voice-output/audio-info.txt

      - name: Upload audiobook
        uses: actions/upload-artifact@v4
        with:
          name: Ravnica-v2-Complete-Voice-Reader-Audio
          path: |
            voice-output/Ravnica-v2-Complete-Living-World-Voice-Reader.mp3
            voice-output/Ravnica-v2-Complete-Voice-Reader-Spoken-Script.txt
            voice-output/audio-info.txt
            voice-output/script-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
