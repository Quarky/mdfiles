name: Import Ravnica living-world guide
# Final validated import; this workflow deletes itself after a successful import.

on:
  push:
    branches:
      - docs/ravnica-guide-rebuild
    paths:
      - .github/workflows/ravnica-import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: docs/ravnica-guide-rebuild
          fetch-depth: 0

      - name: Reconstruct and validate guide
        shell: bash
        run: |
          set -euo pipefail
          test -d .rav-import
          cat             .rav-import/chunk01.txt             .rav-import/chunk02a.txt             .rav-import/chunk02b.txt             .rav-import/chunk03.txt             .rav-import/chunk04a.txt             .rav-import/chunk04b.txt             .rav-import/chunk05.txt             .rav-import/chunk06.txt             .rav-import/chunk07.txt             .rav-import/chunk08.txt             | base64 -d > /tmp/ravnica.zip
          unzip -t /tmp/ravnica.zip
          rm -rf /tmp/ravnica-unpack
          mkdir -p /tmp/ravnica-unpack
          unzip -q /tmp/ravnica.zip -d /tmp/ravnica-unpack
          SRC=/tmp/ravnica-unpack/Ravnica_Living_World_Enveloppe
          test -f "$SRC/README.md"
          test -f "$SRC/Ravnica - Home.md"
          test -f "$SRC/alternate-eras/Guildpact-Novel-10012-ZC/00-Era-Overview.md"
          test -f "$SRC/alternate-eras/War-of-the-Spark/00-Era-Overview.md"
          test -f "$SRC/guilds/10-simic-combine.md"
          test "$(find "$SRC" -type f | wc -l)" -eq 60
          test "$(find "$SRC" -name '*.md' | wc -l)" -ge 50
          if find "$SRC" -name '*.md' -print0 | xargs -0 grep -L '^share: true$' | grep -q .; then
            echo "One or more Markdown files are missing Enveloppe share: true"
            exit 1
          fi

      - name: Replace repository Ravnica folder and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Ravnica
          cp -a /tmp/ravnica-unpack/Ravnica_Living_World_Enveloppe Ravnica
          rm -rf .rav-import
          rm -f .github/workflows/ravnica-import.yml

      - name: Commit rebuilt guide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Ravnica .rav-import .github/workflows/ravnica-import.yml
          git diff --cached --stat
          git commit -m "Ravnica rebuild: import living-world encyclopedia"
          git push origin HEAD:docs/ravnica-guide-rebuild
